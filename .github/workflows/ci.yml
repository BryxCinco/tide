name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch/PR cancels the run it makes obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # @supabase/supabase-js requires Node >= 22 (and Node 20 is end-of-life).
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      # The tests mock Supabase entirely (__tests__/helpers/fakeSupabase.js), so no secrets
      # or network access are needed here.
      - run: npm test

  client-typecheck:
    name: Client typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      # expo-env.d.ts is gitignored and only generated by `expo start`, which CI never runs.
      # Without its expo/types reference, web-only style props (e.g. backdropFilter) fail to
      # typecheck. Same one-line content Expo writes.
      - name: Generate expo-env.d.ts
        run: echo '/// <reference types="expo/types" />' > expo-env.d.ts

      - run: npx tsc --noEmit
